<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A2A17">
<title>Volcano Princess Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --frame: #4A2A17;
    --gold: #C9963E;
    --gold-light: #F2B655;
    --peach: #F9D7B4;
    --cream: #FFF6E3;
    --cream-deep: #FDEBD0;
    --ink: #4A2A17;
    --ink-soft: #8A5A35;
    --muted: #8A7A65;
    --teal: #2F7A6F;
    --teal-fill: #3E8C83;
    --dash: #E3C79A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--frame); }
  body {
    font-family: Alegreya, Georgia, serif;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 12px 12px 90px; }

  h1 {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-weight: 700;
    color: var(--gold-light);
    font-size: 24px;
    text-align: center;
    margin: 8px 0 4px;
  }
  .rule { height: 1px; background: var(--gold); margin: 0 40px 6px; }
  .sub-title { text-align: center; color: #E8C99A; font-size: 14px; margin-bottom: 4px; }

  .panel {
    background: var(--cream);
    border: 1.5px solid #D4A955;
    border-radius: 12px;
    padding: 10px 12px;
    margin-top: 10px;
  }
  .label { font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

  select {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--cream-deep);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
  }

  .item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 7px 0;
    border-bottom: 1px dashed var(--dash);
  }
  .item:last-child { border-bottom: none; }
  .item .text { flex: 1; min-width: 0; }
  .desc { display: block; font-size: 14px; color: var(--ink-soft); }
  .stars { color: #B07A3C; font-size: 14px; white-space: nowrap; }
  .item.done .name { text-decoration: line-through; color: var(--muted); }

  .tick {
    flex: none;
    width: 24px; height: 24px;
    border: 2px solid var(--gold);
    border-radius: 6px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    margin-top: 1px;
  }
  .tick.on { background: var(--teal-fill); border-color: var(--teal-fill); }
  .tick.on::after { content: ''; width: 6px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }

  .link-btn {
    background: none; border: none; font: inherit; font-size: 14px;
    color: var(--teal); cursor: pointer; padding: 2px 0; white-space: nowrap;
  }
  .link-btn.quiet { color: var(--ink-soft); }
  .pin-btn { background: none; border: none; cursor: pointer; padding: 2px 4px; font-size: 18px; color: #D9C3A0; }
  .pin-btn.on { color: var(--gold); }

  .btn {
    width: 100%;
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--peach);
    border: 1.5px solid var(--gold);
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
  }
  .btn.accent { background: var(--teal-fill); border-color: var(--teal-fill); color: var(--cream); }
  .btn.warn { background: #F3C9A0; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .btn { flex: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: 14px;
    border: 1px solid var(--gold);
    background: var(--cream);
    color: var(--ink);
    border-radius: 14px;
    padding: 3px 12px;
    cursor: pointer;
  }
  .chip.on { background: var(--teal-fill); border-color: var(--teal-fill); color: var(--cream); }

  .progress { height: 8px; border-radius: 4px; background: #6B4228; overflow: hidden; margin: 6px 0 2px; }
  .progress i { display: block; height: 100%; background: var(--gold-light); }
  .total { text-align: center; color: var(--cream); font-size: 18px; margin-top: 4px; }

  .group-title { font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; font-style: italic; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details ul { margin: 4px 0 2px; padding-left: 18px; font-size: 14px; color: var(--ink-soft); }
  .empty { font-size: 14px; color: var(--ink-soft); padding: 4px 0; }

  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--frame);
  }
  nav .bar {
    max-width: 520px; margin: 0 auto;
    display: flex; justify-content: space-around;
    background: var(--peach);
    border: 1.5px solid var(--gold);
    border-radius: 12px;
  }
  nav button {
    flex: 1;
    background: none; border: none; font: inherit; font-size: 14px;
    color: var(--ink-soft);
    padding: 6px 0;
    cursor: pointer;
  }
  nav button svg { display: block; margin: 0 auto 2px; width: 22px; height: 22px; }
  nav button.on { color: var(--ink); font-weight: 700; }

  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--cream); color: var(--ink);
    border: 1.5px solid var(--gold); border-radius: 10px;
    padding: 8px 14px; font-size: 14px;
    max-width: 90%; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav>
  <div class="bar">
    <button data-action="tab" data-tab="run">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/></svg>Run
    </button>
    <button data-action="tab" data-tab="endings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Endings
    </button>
    <button data-action="tab" data-tab="achievements">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg>Achievements
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="data.js"></script>
<script>
// ---------- 1. Data and saved state ----------
const DATA = window.VP_DATA;
const STORE_KEY = 'vp-tracker-v1';
const MAX_PINS = 3;
const ROMANCE_TARGET = 140;

const byId = {};
[...DATA.careers, ...DATA.romances, ...DATA.achievements].forEach(x => { byId[x.id] = x; });

function freshState() {
  return {
    v: 1,
    done: {},                                   // only changes from the spreadsheet are stored here
    run: { career: '', romance: '', checks: {} },
    pins: [],
    ui: { tab: 'run', endTab: 'careers', endFilter: 'missing', endSort: 'path', achFilter: 'missing' }
  };
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && saved.v === 1) {
      const base = freshState();
      return { ...base, ...saved, run: { ...base.run, ...saved.run }, ui: { ...base.ui, ...saved.ui } };
    }
  } catch (e) { /* storage unavailable or corrupt: start fresh */ }
  return freshState();
}

let state = loadState();

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { showToast('Could not save on this device. Export a backup to be safe.'); }
}

function isDone(id) {
  return id in state.done ? state.done[id] : !!byId[id].done;
}

function setDone(id, value) {
  if (value === !!byId[id].done) delete state.done[id];
  else state.done[id] = value;
}

// ---------- 2. Small helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stars = n => '★'.repeat(n);
const tick = (on, action, attrs) =>
  `<button class="tick ${on ? 'on' : ''}" data-action="${action}" ${attrs} aria-pressed="${on}" aria-label="Tick"></button>`;

function romanceReqs(r) {
  return [...r.people.map(p => `${p} favour ${ROMANCE_TARGET}+`), ...r.extra];
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// Two-tap confirm instead of pop-up dialogs
let armed = null;
function confirmTap(key, label) {
  if (armed === key) { armed = null; return true; }
  armed = key;
  showToast(`Tap "${label}" again to confirm`);
  setTimeout(() => { if (armed === key) armed = null; }, 3000);
  return false;
}

// ---------- 3. Run screen ----------
function renderRun() {
  const run = state.run;
  const career = byId[run.career];
  const romance = byId[run.romance];

  // Career dropdown grouped by path
  const paths = [...new Set(DATA.careers.map(c => c.path))];
  const careerOptions = paths.map(p =>
    `<optgroup label="${esc(p)}">` +
    DATA.careers.filter(c => c.path === p).map(c =>
      `<option value="${c.id}" ${c.id === run.career ? 'selected' : ''}>${esc(c.name)} · ${c.stars}★${isDone(c.id) ? ' (done)' : ''}</option>`
    ).join('') + '</optgroup>'
  ).join('');

  const romanceOptions = ['Characters', 'Group endings'].map(g =>
    `<optgroup label="${g}">` +
    DATA.romances.filter(r => r.group === (g === 'Group endings')).map(r =>
      `<option value="${r.id}" ${r.id === run.romance ? 'selected' : ''}>${esc(r.name)}${isDone(r.id) ? ' (done)' : ''}</option>`
    ).join('') + '</optgroup>'
  ).join('');

  return `
    <h1>Current run</h1><div class="rule"></div>
    <div class="panel">
      <div class="label"><span>Target career${career ? ' · ' + stars(career.stars) : ''}</span></div>
      <select data-action="pick-career">
        <option value="">Choose a career</option>${careerOptions}
      </select>
      ${career ? `<div class="group-title" style="margin:0 0 4px">${esc(career.path)}${career.sub ? ' › ' + esc(career.sub) : ''}</div>` : ''}
      ${career ? reqList('c', career.id, career.reqs) : ''}
    </div>

    <div class="panel">
      <div class="label"><span>Romance target</span></div>
      <select data-action="pick-romance">
        <option value="">Choose a romance</option>${romanceOptions}
      </select>
      ${romance ? reqList('r', romance.id, romanceReqs(romance)) : ''}
    </div>

    <div class="panel">
      <div class="label"><span>Pinned (${state.pins.length}/${MAX_PINS})</span></div>
      ${state.pins.length ? state.pins.map(id => {
        const a = byId[id], on = isDone(id);
        return `<div class="item ${on ? 'done' : ''}">
          ${tick(on, 'toggle-done', `data-id="${id}"`)}
          <div class="text"><span class="name">${esc(a.name)}</span><span class="desc">${esc(a.desc)}</span></div>
          <button class="link-btn quiet" data-action="pin" data-id="${id}">Unpin</button>
        </div>`;
      }).join('') : '<div class="empty">Pin up to three achievements from the Achievements tab.</div>'}
    </div>

    <button class="btn warn" data-action="new-run">New run</button>
  `;
}

function reqList(prefix, id, reqs) {
  const keys = reqs.map((_, i) => `${prefix}:${id}:${i}`);
  const doneCount = keys.filter(k => state.run.checks[k]).length;
  const items = reqs.map((text, i) => {
    const on = !!state.run.checks[keys[i]];
    return `<div class="item ${on ? 'done' : ''}">
      ${tick(on, 'toggle-check', `data-key="${keys[i]}"`)}
      <div class="text"><span class="name">${esc(text)}</span></div>
    </div>`;
  }).join('');
  const allDone = doneCount === reqs.length;
  const ending = isDone(id)
    ? '<div class="empty" style="color:var(--teal)">Ending already achieved</div>'
    : allDone ? `<button class="btn accent" data-action="achieve" data-id="${id}">Mark ending as achieved</button>` : '';
  return `${items}<div class="empty">${doneCount} of ${reqs.length} done</div>${ending}`;
}

// ---------- 4. Endings screen ----------
function renderEndings() {
  const ui = state.ui;
  const careersDone = DATA.careers.filter(c => isDone(c.id)).length;
  const romDone = DATA.romances.filter(r => isDone(r.id)).length;
  const show = x => ui.endFilter === 'all' || !isDone(x.id);

  let body = '';
  if (ui.endTab === 'careers') {
    if (ui.endSort === 'stars') {
      for (let s = 7; s >= 1; s--) {
        const list = DATA.careers.filter(c => c.stars === s && show(c));
        if (list.length) body += `<div class="panel"><div class="label"><span>${stars(s)}</span></div>${list.map(careerItem).join('')}</div>`;
      }
    } else {
      [...new Set(DATA.careers.map(c => c.path))].forEach(p => {
        const list = DATA.careers.filter(c => c.path === p && show(c));
        if (!list.length) return;
        let lastSub = null, html = '';
        list.forEach(c => {
          if (c.sub !== lastSub) { html += `<div class="group-title">${esc(c.sub || '')}</div>`; lastSub = c.sub; }
          html += careerItem(c);
        });
        body += `<div class="panel"><div class="label"><span>${esc(p)}</span></div>${html}</div>`;
      });
    }
  } else {
    ['Characters', 'Group endings'].forEach(g => {
      const list = DATA.romances.filter(r => r.group === (g === 'Group endings') && show(r));
      if (list.length) body += `<div class="panel"><div class="label"><span>${g}</span></div>${list.map(romanceItem).join('')}</div>`;
    });
  }
  if (!body) body = '<div class="panel"><div class="empty">Nothing missing here. Switch to "All" to see everything.</div></div>';

  return `
    <h1>Endings</h1><div class="rule"></div>
    <div class="chips">
      <button class="chip ${ui.endTab === 'careers' ? 'on' : ''}" data-action="ui" data-key="endTab" data-val="careers">Careers ${careersDone}/${DATA.careers.length}</button>
      <button class="chip ${ui.endTab === 'romance' ? 'on' : ''}" data-action="ui" data-key="endTab" data-val="romance">Romance ${romDone}/${DATA.romances.length}</button>
    </div>
    <div class="chips">
      <button class="chip ${ui.endFilter === 'missing' ? 'on' : ''}" data-action="ui" data-key="endFilter" data-val="missing">Missing</button>
      <button class="chip ${ui.endFilter === 'all' ? 'on' : ''}" data-action="ui" data-key="endFilter" data-val="all">All</button>
      ${ui.endTab === 'careers' ? `
      <button class="chip ${ui.endSort === 'path' ? 'on' : ''}" data-action="ui" data-key="endSort" data-val="path">By path</button>
      <button class="chip ${ui.endSort === 'stars' ? 'on' : ''}" data-action="ui" data-key="endSort" data-val="stars">By stars</button>` : ''}
    </div>
    ${body}
  `;
}

function endingItem(x, title, reqs, targetKey) {
  const on = isDone(x.id);
  const targeted = state.run[targetKey] === x.id;
  return `<div class="item ${on ? 'done' : ''}">
    ${tick(on, 'toggle-done', `data-id="${x.id}"`)}
    <div class="text">
      <details><summary><span class="name">${title}</span></summary>
      <ul>${reqs.map(r => `<li>${esc(r)}</li>`).join('')}</ul></details>
    </div>
    ${targeted
      ? '<span class="link-btn quiet">Targeted</span>'
      : `<button class="link-btn" data-action="target" data-kind="${targetKey}" data-id="${x.id}">Set target</button>`}
  </div>`;
}
const careerItem = c => endingItem(c, `${esc(c.name)} <span class="stars">${c.stars}★</span>`, c.reqs, 'career');
const romanceItem = r => endingItem(r, esc(r.name), romanceReqs(r), 'romance');

// ---------- 5. Achievements screen ----------
function renderAchievements() {
  const ui = state.ui;
  const all = DATA.achievements;
  const doneCount = all.filter(a => isDone(a.id)).length;
  const cats = [...new Set(all.map(a => a.cat))];

  const panels = cats.map(cat => {
    const list = all.filter(a => a.cat === cat);
    const catDone = list.filter(a => isDone(a.id)).length;
    const shown = list.filter(a => ui.achFilter === 'all' || !isDone(a.id));
    const items = shown.map(a => {
      const on = isDone(a.id), pinned = state.pins.includes(a.id);
      return `<div class="item ${on ? 'done' : ''}">
        ${tick(on, 'toggle-done', `data-id="${a.id}"`)}
        <div class="text"><span class="name">${esc(a.name)}</span><span class="desc">${esc(a.desc)}</span></div>
        <button class="pin-btn ${pinned ? 'on' : ''}" data-action="pin" data-id="${a.id}" aria-label="${pinned ? 'Unpin' : 'Pin'}">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="${pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3-1-6zM12 15v6"/></svg>
        </button>
      </div>`;
    }).join('');
    return `<div class="panel"><div class="label"><span>${cat}</span><span>${catDone}/${list.length}</span></div>${items || '<div class="empty">All done</div>'}</div>`;
  }).join('');

  return `
    <h1>Achievements</h1><div class="rule"></div>
    <div class="total">${doneCount} / ${all.length}</div>
    <div class="progress"><i style="width:${Math.round(doneCount / all.length * 100)}%"></i></div>
    <div class="chips">
      <button class="chip ${ui.achFilter === 'missing' ? 'on' : ''}" data-action="ui" data-key="achFilter" data-val="missing">Missing</button>
      <button class="chip ${ui.achFilter === 'all' ? 'on' : ''}" data-action="ui" data-key="achFilter" data-val="all">All</button>
    </div>
    ${panels}
    <div class="panel">
      <div class="label"><span>Backup</span></div>
      <div class="empty">Export saves your ticks and pins to a file. Import restores them on this or another device.</div>
      <div class="row-btns">
        <button class="btn" data-action="export">Export</button>
        <button class="btn" data-action="import">Import</button>
      </div>
      <button class="btn warn" data-action="reset">Reset to spreadsheet</button>
    </div>
  `;
}

// ---------- 6. Drawing the page ----------
function render() {
  const screens = { run: renderRun, endings: renderEndings, achievements: renderAchievements };
  document.getElementById('app').innerHTML = screens[state.ui.tab]();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.ui.tab));
}

function update() { save(); render(); }

// ---------- 7. Handling taps ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.tagName === 'SELECT') return;
  const { action, id } = el.dataset;

  switch (action) {
    case 'tab':
      state.ui.tab = el.dataset.tab;
      window.scrollTo(0, 0);
      return update();
    case 'ui':
      state.ui[el.dataset.key] = el.dataset.val;
      return update();
    case 'toggle-check':
      state.run.checks[el.dataset.key] = !state.run.checks[el.dataset.key];
      return update();
    case 'toggle-done':
      setDone(id, !isDone(id));
      return update();
    case 'achieve':
      setDone(id, true);
      showToast(`${byId[id].name} marked as achieved`);
      return update();
    case 'target':
      state.run[el.dataset.kind] = id;
      showToast(`${byId[id].name} set as your ${el.dataset.kind} target`);
      return update();
    case 'pin':
      if (state.pins.includes(id)) state.pins = state.pins.filter(p => p !== id);
      else if (state.pins.length >= MAX_PINS) return showToast('You can pin up to three. Unpin one first.');
      else state.pins.push(id);
      return update();
    case 'new-run':
      if (!confirmTap('new-run', 'New run')) return;
      state.run.checks = {};
      showToast('Run cleared. Your targets and pins are kept.');
      return update();
    case 'export':
      return exportBackup();
    case 'import':
      return document.getElementById('import-file').click();
    case 'reset':
      if (!confirmTap('reset', 'Reset to spreadsheet')) return;
      state = freshState();
      showToast('Reset to the spreadsheet ticks');
      return update();
  }
});

document.addEventListener('change', e => {
  const action = e.target.dataset.action;
  if (action === 'pick-career' || action === 'pick-romance') {
    state.run[action === 'pick-career' ? 'career' : 'romance'] = e.target.value;
    update();
  }
});

// ---------- 8. Backup ----------
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vp-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById('import-file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.v !== 1 || typeof data.done !== 'object') throw new Error('bad file');
    const base = freshState();
    state = { ...base, ...data, run: { ...base.run, ...data.run }, ui: { ...base.ui, ...data.ui } };
    state.pins = (state.pins || []).filter(id => byId[id]).slice(0, MAX_PINS);
    showToast('Backup imported');
    update();
  } catch (err) {
    showToast("That file isn't a tracker backup.");
  }
});

render();
</script>
</body>
</html>
